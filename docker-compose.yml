services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: travel-blog-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db

    ports:
      - "1337:1337"

    volumes:
      - ./backend/.tmp:/opt/app/.tmp
      - ./backend/public/uploads:/opt/app/public/uploads