services:
  backend:
    image: ghcr.io/nunobaltasar/tsbinfrastructures:latest
    container_name: tsbinfrastructures
    restart: unless-stopped

    env_file:
      - ./backend.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /opt/app/data/data.db

    ports:
      - "1337:1337"

    volumes:
      - ./backend/.tmp:/opt/app/data
      - ./backend/public/uploads:/opt/app/public/uploads

