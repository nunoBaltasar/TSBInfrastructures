name: Frontend CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Astro frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start Strapi
        working-directory: backend
        run: |
          npm run develop > /tmp/strapi.log 2>&1 &
          echo $! > /tmp/strapi.pid
        env:
          HOST: 0.0.0.0
          PORT: 1337
          NODE_ENV: development

          DATABASE_CLIENT: sqlite
          DATABASE_FILENAME: .tmp/data.db

          APP_KEYS: ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key

      - name: Wait for Strapi
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://127.0.0.1:1337/_health > /dev/null; then
              echo "Strapi is ready."
              exit 0
            fi

            echo "Waiting for Strapi: attempt ${attempt}/60"
            sleep 5
          done

          echo "Strapi did not become ready."
          cat /tmp/strapi.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          STRAPI_URL: http://127.0.0.1:1337

      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Show Strapi logs after failure
        if: failure()
        run: |
          if [ -f /tmp/strapi.log ]; then
            echo "===== Strapi logs ====="
            cat /tmp/strapi.log
          fi